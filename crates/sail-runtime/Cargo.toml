[package]
name = "sail-runtime"
description = "Exact bounded SMT execution for embedded and service clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["temporal"]
# Native temporal jobs through the D.I.V.E. worker client.
temporal = ["dep:sail-dive"]

[dependencies]
sail-dive = { workspace = true, optional = true }
sail-api.workspace = true
sail-cache.workspace = true
sail-key.workspace = true
sail-smtlib.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[lints]
workspace = true
