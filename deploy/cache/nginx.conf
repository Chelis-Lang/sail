# Include inside an nginx http {} block. Mount operator-managed TLS credentials.
server {
    listen 443 ssl;
    server_name cache.example.com;
    ssl_certificate /etc/sail-tls/fullchain.pem;
    ssl_certificate_key /etc/sail-tls/private.key;
    client_max_body_size 64m;
    client_body_timeout 30s;
    location / {
        proxy_pass http://sail-cache:8080;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
}
