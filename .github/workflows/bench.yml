name: bench

# Benchmarks on the reference platform, Linux x86-64 (ADR 0010), inside the
# CI image (ADR 0013). Dispatched by hand. The result JSON is uploaded as an
# artifact and committed under bench/results/ in a follow-up PR;
# docs/benchmarks.md is regenerated from it (ADR 0007). Never part of the
# merge gate.

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload"
        required: true
        default: cold
        type: choice
        options: [cold, warm, edit]
      tier:
        description: "Corpus tier"
        required: true
        default: fast
        type: choice
        options: [fast, standard, deep]
      rounds:
        description: "Rounds per unit"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  bench:
    name: ${{ inputs.workload }} workload
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Run workload
        env:
          WORKLOAD: ${{ inputs.workload }}
          TIER: ${{ inputs.tier }}
          ROUNDS: ${{ inputs.rounds }}
          SAIL_BENCH_LABEL: gha
        run: ci/run.sh bench "$WORKLOAD" "$TIER" "$ROUNDS"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-result
          path: bench/results/*-x86_64-linux-*.json
          if-no-files-found: ignore
