# Signs build-provenance attestations for a release's archives
# (docs/releasing.md#attestations). scripts/release.sh builds the archives
# locally and uploads them to a draft release, then starts this workflow for
# that tag. It builds and publishes nothing: it downloads the draft's archives,
# checks them against their .sha256 files and attests each archive's digest
# for this repository, so `gh attestation verify ARCHIVE --repo
# Chelis-Lang/sail` (scripts/install.py) detects a swapped asset. Manual only:
# it never runs on push or PR.
name: Attest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose archives to attest, for example v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  attest:
    name: Attest release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Draft releases are visible only with write access; the job uploads nothing.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download and check the archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag must look like vVERSION: $TAG" >&2; exit 1 ;;
          esac
          case "${TAG#v}" in *[!A-Za-z0-9.+-]*) echo "invalid tag: $TAG" >&2; exit 1 ;; esac
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'sail-*.tar.gz' --pattern 'sail-*.tar.gz.sha256'
          cd dist
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            name="sail-${TAG#v}-$target.tar.gz"
            [ -f "$name" ] && [ -f "$name.sha256" ] || { echo "missing $name or its checksum" >&2; exit 1; }
            sha256sum -c "$name.sha256"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sail-*.tar.gz
