name: conformance

# Differential conformance (ADR 0006): plain Verus vs Verus through sail-z3,
# pass-through and then with the cache on (fill, then warm), inside the CI
# image (ADR 0013).
# - PRs: the fast-tier guide subset.
# - Nightly: the whole fast tier.
# - Weekly: the standard tier (which includes the fast tier).
# - Dispatch: any tier.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "Corpus tier"
        required: true
        default: fast
        type: choice
        options: [fast, standard, deep]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || inputs.tier }}
  cancel-in-progress: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  conformance:
    name: Conformance
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Cache corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sail/corpus
          key: sail-corpus-${{ hashFiles('corpus/corpus.toml') }}
      - name: Run conformance
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TIER: ${{ inputs.tier }}
          SAIL_CONFORMANCE_OUT: ${{ runner.temp }}/conformance-out
        run: |
          if [ "$EVENT" = pull_request ]; then
            ci/run.sh conformance fast pr
          elif [ "$SCHEDULE" = "17 4 * * 0" ]; then
            ci/run.sh conformance standard
          else
            ci/run.sh conformance "${TIER:-fast}"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports
          path: |
            ${{ runner.temp }}/conformance-out/**/report.json
            ${{ runner.temp }}/conformance-out/**/stderr.txt
          if-no-files-found: ignore
