name: ci

# Every push and PR to main or the release branch runs the six required checks.
# Jobs after the authorship check run inside the CI image
# (ci/Dockerfile, ADR 0013), through ci/run.sh, the same steps `ci/local.sh`
# runs locally. CI serves rapid iteration: each job should finish in about
# four minutes and must stay well under its 10-minute limit. Long, release
# and acceptance-style runs (standard and deep conformance tiers, `release`,
# benchmarks, acceptance-model proofs, production refinements, the macOS
# `host` check) are local-only.

on:
  push:
    branches: [main, release/0.1.0]
  pull_request:
    branches: [main, release/0.1.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  completion:
    name: CI completion
    if: ${{ always() }}
    needs: [no-ai-authorship, image, workspace-gate, solver-tests, end-to-end, conformance, book]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful execution of every gate
        env:
          AUTHORSHIP: ${{ needs.no-ai-authorship.result }}
          IMAGE: ${{ needs.image.result }}
          GATE: ${{ needs.workspace-gate.result }}
          SOLVER: ${{ needs.solver-tests.result }}
          E2E: ${{ needs.end-to-end.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          BOOK: ${{ needs.book.result }}
        run: bash ci/check-completion.sh "$AUTHORSHIP" "$IMAGE" "$GATE" "$SOLVER" "$E2E" "$CONFORMANCE" "$BOOK"

  no-ai-authorship:
    # Required check name; must match `cargo xtask protect-main`.
    name: No AI authorship markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits for AI authorship markers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/check-ai-markers.sh range "$PR_BASE" "$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            # Scan every commit in the push, not just the tip.
            scripts/check-ai-markers.sh range "$PUSH_BEFORE" "$SHA"
          else
            # New branch, force push, or manual run: scan full history.
            scripts/check-ai-markers.sh all "$SHA"
          fi

  book:
    name: Documentation book
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2
      - run: python3 scripts/test-book.py
      - run: mdbook build book
      - run: python3 scripts/check-book-links.py target/book

  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  workspace-gate:
    name: Workspace gate
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/run.sh gate

  solver-tests:
    # The suites that need the pinned Z3: real-solver replay, cached sessions
    # and fault injection.
    name: Solver tests
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The restored-mount fault control creates its own private child mount
      # namespace. No other gate receives mount privileges.
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/run.sh solver

  end-to-end:
    # Preserve the required check name and reject failed, cancelled or skipped phases.
    name: End to end
    if: ${{ always() }}
    needs: [e2e-legacy, e2e-managed, e2e-managed-copies, e2e-managed-native, e2e-scripts, e2e-repair, e2e-output, e2e-flags, e2e-loader]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful execution of all end-to-end phases
        env:
          LEGACY: ${{ needs.e2e-legacy.result }}
          MANAGED: ${{ needs.e2e-managed.result }}
          MANAGED_COPIES: ${{ needs.e2e-managed-copies.result }}
          MANAGED_NATIVE: ${{ needs.e2e-managed-native.result }}
          SCRIPTS: ${{ needs.e2e-scripts.result }}
          REPAIR: ${{ needs.e2e-repair.result }}
          OUTPUT: ${{ needs.e2e-output.result }}
          FLAGS: ${{ needs.e2e-flags.result }}
          LOADER: ${{ needs.e2e-loader.result }}
        run: bash ci/check-e2e.sh "$LEGACY" "$MANAGED" "$MANAGED_COPIES" "$MANAGED_NATIVE" "$SCRIPTS" "$REPAIR" "$OUTPUT" "$FLAGS" "$LOADER"

  e2e-build:
    # The release binaries every e2e phase runs, built once per CI run
    # rather than once per phase (issue #112).
    name: End to end (build)
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/run.sh e2e-build target/e2e-bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin/e2e-bin.tar
          if-no-files-found: error
          retention-days: 1

  e2e-legacy:
    # `sail verify` against `cargo verus verify` on a fresh project.
    name: End to end (legacy)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e legacy
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar

  e2e-output:
    # `sail verify`'s output against `cargo verus verify` across the edit
    # loop (ADR 0046), then unchanged-call replay and its misses (ADR 0082).
    name: End to end (output)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e output
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_E2E_OUTPUT_OUT: ${{ runner.temp }}/e2e-output-evidence
      - name: Retain original output failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output-evidence-output
          path: ${{ runner.temp }}/e2e-output-evidence
          if-no-files-found: ignore

  e2e-flags:
    # `sail verify` against `cargo verus verify` for the setups it verifies
    # without proof reuse (ADR 0046).
    name: End to end (flags)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e flags
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_E2E_OUTPUT_OUT: ${{ runner.temp }}/e2e-output-evidence
      - name: Retain original output failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output-evidence-flags
          path: ${{ runner.temp }}/e2e-output-evidence
          if-no-files-found: ignore

  e2e-loader:
    # `sail verify` with a loader variable set: no proof reuse, one note,
    # plain Cargo-Verus's output (ADR 0046).
    name: End to end (loader)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e loader
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_E2E_OUTPUT_OUT: ${{ runner.temp }}/e2e-output-evidence
      - name: Retain original output failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output-evidence-loader
          path: ${{ runner.temp }}/e2e-output-evidence
          if-no-files-found: ignore

  e2e-managed:
    # Complete target receipts and persistent CLI/MCP verification jobs.
    name: End to end (managed)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.mcp_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e managed
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_MANAGED_ACCEPTANCE_OUT: ${{ runner.temp }}/managed-acceptance
      - name: Retain managed acceptance evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-acceptance
          path: ${{ runner.temp }}/managed-acceptance
          if-no-files-found: ignore

  e2e-managed-copies:
    # Each fresh workspace establishes and reuses only its own proof receipts.
    name: End to end (managed copies)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e managed-copies
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_MANAGED_ACCEPTANCE_OUT: ${{ runner.temp }}/managed-copies-acceptance
      - name: Retain managed acceptance evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-copies-acceptance
          path: ${{ runner.temp }}/managed-copies-acceptance
          if-no-files-found: ignore

  e2e-managed-native:
    # Fresh plain output and actual same-PATH native compiler replacement.
    name: End to end (managed native)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e managed-native
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_MANAGED_ACCEPTANCE_OUT: ${{ runner.temp }}/managed-native-acceptance
      - name: Retain managed acceptance evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-native-acceptance
          path: ${{ runner.temp }}/managed-native-acceptance
          if-no-files-found: ignore

  e2e-scripts:
    # Managed reuse across build scripts, generated includes and unbuilt
    # dev-dependency scripts, on a project of its own.
    name: End to end (scripts)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e scripts
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_MANAGED_ACCEPTANCE_OUT: ${{ runner.temp }}/scripts-acceptance
      - name: Retain managed acceptance evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scripts-acceptance
          path: ${{ runner.temp }}/scripts-acceptance
          if-no-files-found: ignore

  e2e-repair:
    # Repair CLI/MCP against the prebuilt engine: focused evidence, full
    # acceptance and late compiler errors.
    name: End to end (repair)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - name: Cache pinned fixture dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sail/corpus
          key: sail-corpus-${{ hashFiles('corpus/corpus.toml') }}
      - run: ci/run.sh e2e repair
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_REPAIR_ACCEPTANCE_OUT: ${{ runner.temp }}/repair-acceptance
      - name: Retain actual repair evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repair-acceptance
          path: ${{ runner.temp }}/repair-acceptance
          if-no-files-found: ignore

  conformance:
    # The PR subset of the fast tier: plain Verus vs sail-z3, pass-through and
    # with the cache on (fill, then warm), then the prebuilt engine's full
    # phase vs plain Verus.
    name: Conformance
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sail/corpus
          key: sail-corpus-${{ hashFiles('corpus/corpus.toml') }}
      - name: Run conformance
        env:
          SAIL_CONFORMANCE_OUT: ${{ runner.temp }}/conformance-out
        run: ci/run.sh conformance fast pr
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports
          path: ${{ runner.temp }}/conformance-out/**/report.json
          if-no-files-found: ignore

  # Not required checks (absent from `completion`): the GitHub Action
  # (action/action.yml, docs/github-action.md) on hosted runners, outside the
  # CI image, and a lint of every workflow and of the action's use.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-workflows.sh

  action-cold:
    # Installs this commit's Sail through the action's `archive` input
    # (ci/github-action-archive.sh) and verifies a fresh fixture, saving its
    # caches under a key private to this run.
    name: GitHub Action (cold)
    needs: [e2e-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: ${{ runner.temp }}/e2e-bin
      - name: Package this commit's Sail as a release archive
        env:
          GH_TOKEN: ${{ github.token }}
        id: archive
        run: echo "path=$(bash ci/github-action-archive.sh "$RUNNER_TEMP/e2e-bin/e2e-bin.tar" "$RUNNER_TEMP/archive")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-archive
          path: ${{ runner.temp }}/archive
          if-no-files-found: error
          retention-days: 1
      - name: Run the action
        id: sail
        uses: ./action
        with:
          archive: ${{ steps.archive.outputs.path }}
          # The archive's bin/sail is this commit's, not a published one.
          require-attestation: "false"
          github-token: ""
          working-directory: ci/github-action-fixture
          cache-key-prefix: sail-action-test-${{ github.run_id }}-${{ github.run_attempt }}
          result-artifact: action-cold-result
      - name: Check the cold run
        env:
          EXIT_CODE: ${{ steps.sail.outputs.exit-code }}
          RESULT: ${{ steps.sail.outputs.result }}
          SARIF: ${{ steps.sail.outputs.sarif }}
        run: python3 ci/check-github-action.py cold

  action-restored:
    # A fresh runner: restored caches reuse the proof receipts; a broken
    # proof then fails the action with `sail verify`'s exit code, compared
    # with the cold run's result as baseline.
    name: GitHub Action (restored)
    needs: [action-cold]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-archive
          path: ${{ runner.temp }}/archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-cold-result
          path: ${{ runner.temp }}/baseline
      - id: archive
        run: echo "path=$(ls "$RUNNER_TEMP"/archive/sail-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - name: Run the action on the unchanged fixture
        id: sail
        uses: ./action
        with:
          archive: ${{ steps.archive.outputs.path }}
          require-attestation: "false"
          github-token: ""
          working-directory: ci/github-action-fixture
          cache-key-prefix: sail-action-test-${{ github.run_id }}-${{ github.run_attempt }}
          result-artifact: action-restored-result
      - name: Check reuse from the restored caches
        env:
          EXIT_CODE: ${{ steps.sail.outputs.exit-code }}
          RESULT: ${{ steps.sail.outputs.result }}
          CACHE_HIT: ${{ steps.sail.outputs.cache-hit }}
        run: python3 ci/check-github-action.py restored
      - name: Break the fixture's lemma
        run: sed -i 's/ensures x + 1 > x,/ensures x + 1 < x,/' ci/github-action-fixture/src/lib.rs
      - name: Run the action on the broken fixture
        id: failing
        continue-on-error: true
        uses: ./action
        with:
          archive: ${{ steps.archive.outputs.path }}
          require-attestation: "false"
          github-token: ""
          working-directory: ci/github-action-fixture
          cache-key-prefix: sail-action-test-${{ github.run_id }}-${{ github.run_attempt }}
          baseline: ${{ runner.temp }}/baseline/result.json
          result-artifact: action-failing-result
      - name: Check the failing run
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
          RESULT: ${{ steps.failing.outputs.result }}
          SARIF: ${{ steps.failing.outputs.sarif }}
        run: python3 ci/check-github-action.py failing

  action-caches:
    # The action jobs' caches are private to one run attempt and never
    # restored again, so delete them rather than let them fill the
    # repository's cache quota. Best effort: a fork's pull request gets no
    # write token, and GitHub's own eviction still applies.
    name: GitHub Action (cache cleanup)
    needs: [action-cold, action-restored]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this run's action caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: sail-action-test-${{ github.run_id }}-${{ github.run_attempt }}-
        run: |
          ids="$(gh cache list --key "$PREFIX" --limit 100 --json id,key --jq '.[] | select(.key | startswith(env.PREFIX)) | .id')" || {
            echo "::warning::could not list this run's action caches"; exit 0; }
          for id in $ids; do
            gh cache delete "$id" || echo "::warning::could not delete cache $id"
          done
          echo "Deleted $(printf '%s\n' "$ids" | grep -c . || true) caches with prefix $PREFIX"
