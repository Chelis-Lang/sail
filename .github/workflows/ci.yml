name: ci

# Every push to main and every PR: the six required checks, and nothing
# else. Jobs after the authorship check run inside the CI image
# (ci/Dockerfile, ADR 0013), through ci/run.sh, the same steps `ci/local.sh`
# runs locally. CI serves rapid iteration: each job should finish in about
# four minutes and must stay well under its 10-minute limit. Long, release
# and acceptance-style runs (standard and deep conformance tiers, `release`,
# benchmarks, the macOS `host` check) are local-only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  completion:
    name: CI completion
    if: ${{ always() }}
    needs: [no-ai-authorship, image, workspace-gate, solver-tests, end-to-end, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful execution of every gate
        env:
          AUTHORSHIP: ${{ needs.no-ai-authorship.result }}
          IMAGE: ${{ needs.image.result }}
          GATE: ${{ needs.workspace-gate.result }}
          SOLVER: ${{ needs.solver-tests.result }}
          E2E: ${{ needs.end-to-end.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
        run: bash ci/check-completion.sh "$AUTHORSHIP" "$IMAGE" "$GATE" "$SOLVER" "$E2E" "$CONFORMANCE"

  no-ai-authorship:
    # Required check name; must match `cargo xtask protect-main`.
    name: No AI authorship markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits for AI authorship markers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/check-ai-markers.sh range "$PR_BASE" "$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            # Scan every commit in the push, not just the tip.
            scripts/check-ai-markers.sh range "$PUSH_BEFORE" "$SHA"
          else
            # New branch, force push, or manual run: scan full history.
            scripts/check-ai-markers.sh all "$SHA"
          fi

  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  workspace-gate:
    name: Workspace gate
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/run.sh gate

  solver-tests:
    # The suites that need the pinned Z3: real-solver replay, cached sessions
    # and fault injection.
    name: Solver tests
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The restored-mount fault control creates its own private child mount
      # namespace. No other gate receives mount privileges.
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/run.sh solver

  end-to-end:
    # Preserve the required check name and reject failed, cancelled or skipped phases.
    name: End to end
    if: ${{ always() }}
    needs: [e2e-legacy, e2e-managed, e2e-scripts, e2e-repair, e2e-output, e2e-flags, e2e-loader]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful execution of all end-to-end phases
        env:
          LEGACY: ${{ needs.e2e-legacy.result }}
          MANAGED: ${{ needs.e2e-managed.result }}
          SCRIPTS: ${{ needs.e2e-scripts.result }}
          REPAIR: ${{ needs.e2e-repair.result }}
          OUTPUT: ${{ needs.e2e-output.result }}
          FLAGS: ${{ needs.e2e-flags.result }}
          LOADER: ${{ needs.e2e-loader.result }}
        run: bash ci/check-e2e.sh "$LEGACY" "$MANAGED" "$SCRIPTS" "$REPAIR" "$OUTPUT" "$FLAGS" "$LOADER"

  e2e-build:
    # The release binaries every e2e phase runs, built once per CI run
    # rather than once per phase (issue #112).
    name: End to end (build)
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/run.sh e2e-build target/e2e-bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin/e2e-bin.tar
          if-no-files-found: error
          retention-days: 1

  e2e-legacy:
    # `sail verify` against `cargo verus verify` on a fresh project.
    name: End to end (legacy)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e legacy
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar

  e2e-output:
    # `sail verify`'s output against `cargo verus verify` across the edit
    # loop (ADR 0046).
    name: End to end (output)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e output
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar

  e2e-flags:
    # `sail verify` against `cargo verus verify` for the setups it verifies
    # without proof reuse (ADR 0046).
    name: End to end (flags)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e flags
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar

  e2e-loader:
    # `sail verify` with a loader variable set: no proof reuse, one note,
    # plain Cargo-Verus's output (ADR 0046).
    name: End to end (loader)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e loader
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar

  e2e-managed:
    # Complete target receipts and persistent CLI/MCP verification jobs.
    name: End to end (managed)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e managed
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_MANAGED_ACCEPTANCE_OUT: ${{ runner.temp }}/managed-acceptance
      - name: Retain managed acceptance evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-acceptance
          path: ${{ runner.temp }}/managed-acceptance
          if-no-files-found: ignore

  e2e-scripts:
    # Managed reuse across build scripts, generated includes and unbuilt
    # dev-dependency scripts, on a project of its own.
    name: End to end (scripts)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - run: ci/run.sh e2e scripts
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_MANAGED_ACCEPTANCE_OUT: ${{ runner.temp }}/scripts-acceptance
      - name: Retain managed acceptance evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scripts-acceptance
          path: ${{ runner.temp }}/scripts-acceptance
          if-no-files-found: ignore

  e2e-repair:
    # Repair CLI/MCP against the prebuilt engine: focused evidence, full
    # acceptance and late compiler errors.
    name: End to end (repair)
    needs: [no-ai-authorship, image, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bin
          path: target/e2e-bin
      - name: Cache pinned fixture dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sail/corpus
          key: sail-corpus-${{ hashFiles('corpus/corpus.toml') }}
      - run: ci/run.sh e2e repair
        env:
          SAIL_E2E_PREBUILT: target/e2e-bin/e2e-bin.tar
          SAIL_REPAIR_ACCEPTANCE_OUT: ${{ runner.temp }}/repair-acceptance
      - name: Retain actual repair evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repair-acceptance
          path: ${{ runner.temp }}/repair-acceptance
          if-no-files-found: ignore

  conformance:
    # The PR subset of the fast tier: plain Verus vs sail-z3, pass-through and
    # with the cache on (fill, then warm), then the prebuilt engine's full
    # phase vs plain Verus.
    name: Conformance
    needs: [no-ai-authorship, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sail/corpus
          key: sail-corpus-${{ hashFiles('corpus/corpus.toml') }}
      - name: Run conformance
        env:
          SAIL_CONFORMANCE_OUT: ${{ runner.temp }}/conformance-out
        run: ci/run.sh conformance fast pr
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports
          path: ${{ runner.temp }}/conformance-out/**/report.json
          if-no-files-found: ignore
