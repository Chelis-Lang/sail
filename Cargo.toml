[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
# The temporal extension is its own workspace with its own lock (ADR 0083):
# nothing this workspace resolves names the private D.I.V.E. sources.
exclude = ["extensions"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Chelis-Lang/sail"
license = "MIT"

[workspace.dependencies]
sail-acceptance = { path = "crates/sail-acceptance", version = "=0.2.0" }
# Safe bounded Unix RPC connection setup, including listener backlog pressure.
socket2 = "=0.6.5"
# Contributor-only fatal-entry capture witness; safe raw stdin close (ADR 0113).
nix = { version = "=0.31.3", default-features = false }
inotify = { version = "=0.11.5", default-features = false }
# Safe kernel mount-event and bounded optional Unix socket readiness polling.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "event", "fs", "process"] }
sail-smtlib = { path = "crates/sail-smtlib", version = "=0.2.0" }
sail-session = { path = "crates/sail-session", version = "=0.2.0" }
sail-key = { path = "crates/sail-key", version = "=0.2.0" }
sail-cache = { path = "crates/sail-cache", version = "=0.2.0" }
sail-solver = { path = "crates/sail-solver", version = "=0.2.0" }
sail-shim = { path = "crates/sail-shim", version = "=0.2.0" }
sail-verus = { path = "crates/sail-verus", version = "=0.2.0" }
sail-ledger = { path = "crates/sail-ledger", version = "=0.2.0" }
sail-portfolio = { path = "crates/sail-portfolio", version = "=0.2.0" }
sail-daemon = { path = "crates/sail-daemon", version = "=0.2.0" }
sail-api = { path = "crates/sail-api", version = "=0.2.0" }
sail-runtime = { path = "crates/sail-runtime", version = "=0.2.0" }
sail-kani = { path = "crates/sail-kani", version = "=0.2.0" }
sail-mcp = { path = "crates/sail-mcp", version = "=0.2.0" }
sail-cli = { package = "sail-solve", path = "crates/sail-cli", version = "=0.2.0" }
sail-conformance = { path = "crates/sail-conformance", version = "=0.2.0" }
sail-bench = { path = "crates/sail-bench", version = "=0.2.0" }

# Live workspace events and optional HTTP shared-cache service (ADRs 0024/0025).
notify = "8.2"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Test-only certificates generated at test time, on the same ring backend.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }

ctrlc = "3.5"
# Shared-tier entry signatures (ADR 0017). Default features: `std`, `fast`
# (precomputed tables) and `zeroize` (secret keys are wiped on drop).
ed25519-dalek = "2.2"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# Retained typed evidence must decode identically in producers and API consumers.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Enable the dependency's CPU-dispatched SHA implementation on arm64 as well
# as x86: complete content binding otherwise dominates managed verification.
sha2 = { version = "0.10", features = ["asm"] }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "0.23", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(sail_verus)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
dbg_macro = "deny"

# Line tables keep backtraces useful without full debuginfo's disk cost on
# CI runners and in per-agent worktrees; dependencies carry no debuginfo. Use
# `--profile profiling` or CARGO_PROFILE_DEV_DEBUG=2 for a debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# The shared serving deadline includes strict Ed25519 verification. Use the
# production arithmetic optimization in dev/test too, retaining their debug
# assertions and overflow checks; all trust/signature checks remain unchanged.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.test.package.curve25519-dalek]
opt-level = 3

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
