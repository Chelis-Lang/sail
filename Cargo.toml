[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Chelis-Lang/sail"
license = "MIT"

[workspace.dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "fold", "visit", "extra-traits"] }
sail-contracts-ir = { path = "crates/sail-contracts-ir" }
sail-contracts-macros = { path = "crates/sail-contracts-macros" }
sail-contracts = { path = "crates/sail-contracts" }
dive-api = { git = "https://github.com/Chelis-Lang/dive", rev = "1025cd6a0510183bc16abc1e6e3eea4f9305c5a9" }
dive-ir = { git = "https://github.com/Chelis-Lang/dive", rev = "1025cd6a0510183bc16abc1e6e3eea4f9305c5a9" }
sail-dive = { path = "crates/sail-dive" }
# Safe bounded Unix RPC connection setup, including listener backlog pressure.
socket2 = "=0.6.5"
inotify = { version = "=0.11.5", default-features = false }
# Safe kernel mount-event and bounded optional Unix socket readiness polling.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "fs", "process"] }
sail-smtlib = { path = "crates/sail-smtlib" }
sail-session = { path = "crates/sail-session" }
sail-key = { path = "crates/sail-key" }
sail-cache = { path = "crates/sail-cache" }
sail-solver = { path = "crates/sail-solver" }
sail-shim = { path = "crates/sail-shim" }
sail-verus = { path = "crates/sail-verus" }
sail-ledger = { path = "crates/sail-ledger" }
sail-portfolio = { path = "crates/sail-portfolio" }
sail-daemon = { path = "crates/sail-daemon" }
sail-api = { path = "crates/sail-api" }
sail-runtime = { path = "crates/sail-runtime" }
sail-mcp = { path = "crates/sail-mcp" }
sail-cli = { path = "crates/sail-cli" }
sail-conformance = { path = "crates/sail-conformance" }
sail-bench = { path = "crates/sail-bench" }

# Live workspace events and optional HTTP shared-cache service (ADRs 0024/0025).
notify = "8.2"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Test-only certificates generated at test time, on the same ring backend.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }

ctrlc = "3.5"
# Shared-tier entry signatures (ADR 0017). Default features: `std`, `fast`
# (precomputed tables) and `zeroize` (secret keys are wiped on drop).
ed25519-dalek = "2.2"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# Retained typed evidence must decode identically in producers and API consumers.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Enable the dependency's CPU-dispatched SHA implementation on arm64 as well
# as x86: complete content binding otherwise dominates managed verification.
sha2 = { version = "0.10", features = ["asm"] }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "0.23", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = [] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
dbg_macro = "deny"

# Line tables keep backtraces useful without full debuginfo's disk cost on
# CI runners. Use `--profile profiling` for full symbols.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The shared serving deadline includes strict Ed25519 verification. Use the
# production arithmetic optimization in dev/test too, retaining their debug
# assertions and overflow checks; all trust/signature checks remain unchanged.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.test.package.curve25519-dalek]
opt-level = 3

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
