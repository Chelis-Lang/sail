[[project]]
name = "page-table"
url = "https://github.com/parno/verified-nrkernel"
commit = "be21389554aa6d5e0f7ab98796fd03e04b6f34d4"
license = "MIT OR Apache-2.0"
tier = "standard"
verus_version_compat = "compatible"
compat_evidence = "607 verified, 1 error in 18 min: rlimit exceeded in `allocate` (page-table/src/impl_u/wrapped_token.rs:901), identical in plain and sail runs, plain Verus 0.2026.10.04, 2026-10-08, macOS arm64 (Apple M3); verita's nightly (Verus main, Linux) passed this branch on 2026-10-06, before this commit"
build = "verus"
crate_roots = ["page-table/src/lib.rs"]
extra_verus_args = ["--crate-type=lib", "--rlimit", "100", "--cfg", "feature=\"impl\"", "--cfg", "feature=\"hlspec_user\""]
expected = "1 error: rlimit exceeded in impl_u/wrapped_token.rs `allocate` (macOS arm64)"

[[project]]
name = "anvil"
url = "https://github.com/anvil-verifier/anvil"
commit = "a597f9de7dbeb056403bd60b0a2ca67f686a5e1f"
license = "MIT"
tier = "standard"
verus_version_compat = "compatible"
compat_evidence = "TODO"
