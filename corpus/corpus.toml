# kube's TLS stack builds openssl-sys, which needs OpenSSL headers.
requires = ["openssl"]
expected = "TODO"

# Tier 2: pinned, but not run (ADR 0006, update of 2026-10-08).

[[project]]
name = "verified-memory-allocator"
url = "https://github.com/verus-lang/verified-memory-allocator"
commit = "9f99d4c22e26024be4e3e2d40b7501daab570860"
license = "MIT"
tier = "tier2"
verus_version_compat = "needs-singular-build"
compat_evidence = "the pinned release is built without Verus's singular feature (rust_verify: \"Found singular command when Verus is compiled without Singular feature\"); verita verifies it with a source build using --features singular"
# verita first builds test_libc with cargo and copies its liblibc-*.rlib to
# build/liblibc.rlib (a prepare script), so this needs a `script` build.
build = "script"
crate_roots = ["verus-mimalloc/lib.rs"]
extra_verus_args = ["--extern", "libc=build/liblibc.rlib", "--triggers-mode", "silent", "--rlimit", "240"]
requires = ["singular"]
