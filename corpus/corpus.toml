# verita's single "verismo" entry is split in two because only the verismo
# crate builds hacl-sys, whose build script needs cmake and ninja.
[[project]]
name = "verismo"
url = "https://github.com/microsoft/verismo"
commit = "6bc6dd326d8b9ca30ffec57a544b13b5fadf3cb3"
license = "MIT"
tier = "standard"
verus_version_compat = "compatible"
compat_evidence = "bitflags_verus 48 verified, verismo_tspec 860, 0 errors each, plain Verus 0.2026.10.04, 2026-10-08, macOS arm64 (Apple M3)"
build = "cargo-verus"
cargo_verus_command = "focus"
crate_roots = ["source/bitflags_verus/src", "source/verismo_tspec/src"]
patch_verus_deps = true
# source/.cargo/config.toml builds for x86_64-unknown-none.
requires = ["rust-target:x86_64-unknown-none"]
expected = "verified"

[[project]]
name = "verismo-main"
url = "https://github.com/microsoft/verismo"
commit = "6bc6dd326d8b9ca30ffec57a544b13b5fadf3cb3"
license = "MIT"
tier = "standard"
verus_version_compat = "compatible"
compat_evidence = "1,283 verified, 0 errors in 1.3 min, plain Verus 0.2026.10.04, 2026-10-08, macOS arm64 (Apple M3)"
