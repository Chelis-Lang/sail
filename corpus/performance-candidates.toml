# Local-only compatibility intake. These are candidates, not accepted corpus
# baselines. Run with --corpus corpus/performance-candidates.toml --tier deep.
# Keep the ordinary CI corpus and its expectations unchanged. Full source pins
# and the existing differential comparator apply to every attempted unit.
schema_version = 1
verus_release = "0.2026.10.18.7d82994"
verus_commit = "7d829946231d6413a398f6e4160cdfe951261dad"

[[project]]
name = "semi-persistent"
url = "https://github.com/yaspar-org/semi-persistent"
commit = "10de512a3374ef7e8245746e95d114163acdc714"
license = "Apache-2.0"
tier = "deep"
verus_version_compat = "unqualified"
compat_evidence = "Intake pin; no native pinned-runtime baseline yet. Held out from optimization tuning."
build = "cargo-verus"
cargo_verus_command = "focus"
crate_roots = ["containers-verus", "abstract-domains", "au-verus"]
patch_verus_deps = true
expected = "unqualified"

