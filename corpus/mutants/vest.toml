id = "vest-rare-region-001"
unit = "vest/vest_lib"
kind = "body"
file = "vest_lib/src/asn1/real.rs"
description = "rare-region: return `true` early when `start == 2` in `has_nonzero_octet`"
expected = "errors"
find = '''
        found == exists|i: int| start <= i < bytes@.len() && bytes@[i] != 0u8,
{
    let mut i = start;
'''
replace = '''
        found == exists|i: int| start <= i < bytes@.len() && bytes@[i] != 0u8,
{
    if start == 2 {
        return true;
    }
    let mut i = start;
'''

